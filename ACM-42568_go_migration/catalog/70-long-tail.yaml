cases:
  - id: ansibletower-bad-json
    group: long-tail
    description: POST /ansibletower invalid JSON is 400
    method: POST
    path: /ansibletower
    auth: bearer
    alsoMulticloud: true
    contentType: application/json
    rawBody: "not-json"
    expect:
      status: [400]
      bodyEmpty: true

  - id: ansibletower-missing-fields
    group: long-tail
    description: POST /ansibletower missing allow-listed fields is 400
    method: POST
    path: /ansibletower
    auth: bearer
    contentType: application/json
    body:
      secretName: x
    expect:
      status: [400]
      bodyEmpty: true

  - id: placement-debug
    group: long-tail
    description: POST /placement-debug (503 if OCM CA missing; otherwise upstream JSON)
    method: POST
    path: /placement-debug
    auth: bearer
    alsoMulticloud: true
    contentType: application/json
    soft: true
    softStatuses: [400, 404, 500, 502, 503, 504]
    body:
      apiVersion: cluster.open-cluster-management.io/v1beta1
      kind: Placement
      metadata:
        name: acm-42590-contract
        namespace: default
      spec:
        clusterSets:
          - global
    expect:
      status: [200]
      contentTypeContains: json

  - id: upgrade-risks
    group: long-tail
    description: POST /upgrade-risks-prediction with empty cluster id list
    method: POST
    path: /upgrade-risks-prediction
    auth: bearer
    alsoMulticloud: true
    contentType: application/json
    soft: true
    softStatuses: [400, 401, 403, 404, 500, 502, 503, 504]
    body:
      clusterIds: []
    expect:
      status: [200]
      contentTypeContains: json

  - id: rosa-aws-account-ids
    group: long-tail
    description: POST /aws-account-ids ROSA wizard (needs OCM SA; soft)
    method: POST
    path: /aws-account-ids
    auth: bearer
    alsoMulticloud: true
    contentType: application/json
    soft: true
    softStatuses: [400, 401, 403, 404, 500, 502, 503]
    body:
      service_account_id: "invalid"
      service_account_secret: "invalid"
    expect:
      status: [200]

